name: Release
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          release-type: python
      - name: Check release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          gh workflow run checks.yml --ref "$branch" --repo "$GITHUB_REPOSITORY"
